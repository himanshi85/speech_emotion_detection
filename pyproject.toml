[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-emotion-recognition"
version = "0.3.0"
description = "Multi-Corpus Speech Emotion Recognition (SER) Benchmarking Framework across RAVDESS, CREMA-D, SAVEE, TESS, and Unified Foundation Models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "huggingface_hub>=0.20.0",
    "transformers>=4.36.0",
    "torch>=2.0.0",
    "soundfile>=0.12",
    "av>=12.0.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ser*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
