# Default Wav2Vec2-XLS-R-300M SER experiment config
# Section 10: freeze_encoder=false => Mode B full fine-tuning (default)

model_name: facebook/wav2vec2-xls-r-300m
num_classes: 8
sample_rate: 16000
dropout: 0.3

# Fine-tuning strategy (Section 10)
# false = Mode B full fine-tuning (DEFAULT)
# true  = Mode A frozen encoder (same as CLI --freeze_encoder)
freeze_encoder: false
fine_tuning_mode: full

batch_size: 4
num_epochs: 20
encoder_learning_rate: 1.0e-5
classifier_learning_rate: 1.0e-4
weight_decay: 0.01
warmup_ratio: 0.1
gradient_accumulation_steps: 4
mixed_precision: true
early_stopping_patience: 5
seed: 42
